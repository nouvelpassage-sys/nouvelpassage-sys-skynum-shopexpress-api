    get:
      summary: List webhooks
      tags:
      - Webhooks
      description: Fetch all webhooks
      security:
      - bearer: []
      parameters:
      - name: x-partner-token
        in: header
      responses:
        '200':
          description: Return all webhooks
          content:
            application/json:
              examples:
                all_webhooks:
                  value:
                    webhooks:
                    - id: 01H86YTPSMT4GM9HT0S0E625AF
                      notification_email: notification.email@company.com
                      event: contragent_created
                      endpoint: https://your-enpoint.com/webhooks
                      secret: XXXXX
                      authentication:
                        header_name: Authorization
                        header_value: your-token
                        type: api_key
    post:
      summary: Create webhook
      tags:
      - Webhooks
      description: |
        In order to subscribe for some event you should use this endpoint and create new webhook. After subscription we start sending all related events to your server. Event could be records update, create and destroy. For example, when contragent created we can send event about it.

        ## Parameters description

        **event**: Event name, supported events - contragent_created, contragent_updated, contragent_deleted, discount_created, discount_updated, discount_deleted (required).

        **endpoint**: Url to send webhooks, required field, and should starts with "https://" (required).

        **notification_email**: Email for webhooks notification errors (optional).

        **external_client_id**: Could be any value, we return it back with each event. It exists in order to help external system recognize to which client this event belongs (optional).

        **authentication**: If an endpoint have authentication then you should provide authentication data (optional).

        **secret**: If you want to provide your own secret phrase to verify webhook event signature (optional).

        ## Signature verification

        Each webhook event includes **x-skynum-signature** that you may use to verify webhook. Using a HMAC library of your choice (most languages provide functions in the standard library for this purpose) create a digest with the following:

        **Secret phrase**: We return it on each webhook API request within **secret** property. The secret phrase is different of each webhook or you may provide own secret.

        **Encoding**: HEX.

        **Hash function**: SHA-256.

        **Payload**: Ensure exact JSON payload match, attributes order is important - `{"one":"1","two":"2"}` and `{"two":"2","one":"1"}` are equal objects, but different strings. Strip out all whitespace characters from the payload to generate the hash.

        For example, given following inputs:

        - Secret `WwSu98s9lhgcm-Xzw8IzikhrJ`

        - Payload `{"event":"contragent_created","contragents":[{"id":"8b26e3ca-4cd1-11ee-9f40-7a7a00659b8b","title":"Sample"}]}`

        The result should be: `cc36dc51e5b2ec5c3f31d4a0c7bbdb4e6df5c2e6e33189dd80e1c909e9e75f16`

        **NOTE**: Verifying webhook signature in Node.js/JavaScript will be difficult or even impossible. This is because when JSON.stringify() is used to convert the webhook POST body to a JSON string, floating point values ending in trailing zeros, e.g. (1.0) have the trailing zeros removed, e.g.(1). This changes the webhook body and results in a different HMAC code being calculated.
      security:
