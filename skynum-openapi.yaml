    post:
      summary: Create payment
      tags:
      - Payments
      description: |+
        Creates a new payment. For each payment typedoc should be provided.

        ## Payment typedocs:

        **bank_in**: Incoming Bank Payment.

        **bank_out**: Outgoing Bank Payment.

        **cash_in**: Incoming Cash Payment.

        **cash_out**: Outgoing Cash Payment.

        **cash_conversion**: Cash Conversion.

        **bank_conversion**: Bank Conversion.

        ## Payment typepayments:

        **settlement_with_clients**: Settlements with buyers. Related payment_subject_type = 'Contragent'.

        **settlement_with_suppliers**: Settlements with suppliers. Related payment_subject_type = 'Contragent'.

        **expense**: Costs. Related payment_subject_type = 'Expense'.

        **money_on_way**: Money in transit. Related payment_subject_type = 'Contragent'.

        **encashment**: Encashment. Related payment_subject_type = 'Bankbox'.

        **cash_from_bank**: Cash from bank. Related payment_subject_type = 'Bankbox'.

        **founder**: Founding member. Related payment_subject_type = 'Founder'.

        **cashbox_transfer**: Transfer to the cash desk. Related payment_subject_type = 'Cashbox'.

        **initial_cash_remain**: Cash opening balance. Related payment_subject_type = 'Cashbox'.

        **initial_bank_remain**: Bank opening balance. Related payment_subject_type = 'Bankbox'.

        **initial_client_debt**: Initial debt of the buyer(s). Related payment_subject_type = 'Contragent'.

        **initial_debt_to_supplier**: Initial debt to supplier(s). Related payment_subject_type = 'Contragent'.

        **bankbox_transfer**: Transfer to the bank. Related payment_subject_type = 'Bankbox'.

        **nds**: Payment of VAT. Related payment_subject_type = 'Agency'.

        **expense_creditors**: Creditors by expenses. Related payment_subject_type = 'Contragent'.

        **taxes**: Other taxes. Related payment_subject_type = 'Tax'.

        **debtors_creditors**: Debtors and creditors. Related payment_subject_type = 'Contragent'.

        **settlement_with_employees**: Settlements with employees. Related payment_subject_type = 'Employee'.


        Payment initially saved in created state, which doesn't make changes in system, basically it's just draft.
        You should call activate to make changes.

        In order to attach payment to document use binds.

