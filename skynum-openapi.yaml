                      endpoint: https://your-enpoint.com/webhooks
                      secret: XXXXX
                      authentication:
                        header_name: Authorization
                        header_value: your-token
                        type: api_key
      requestBody:
        content:
          application/json:
            schema:
              properties:
                webhook:
                  type: object
                  properties:
                    notification_email:
                      type: string
                      example: notification.email@company.com
                    event:
                      type: string
                      example: contragent_created
                    endpoint:
                      type: string
                      example: https://your-enpoint.com/webhooks
                    external_client_id:
                      type: string
                      example: 
                    secret:
                      type: string
                      example: XXXXX
                    authentication:
                      type: object
                      example:
                        header_name: Authorization
                        header_value: your-token
                        type: api_key
                  required:
                  - event
                  - endpoint
