    post:
      summary: Create document
      tags:
      - Documents
      description: |
        Creates a new document. For each document typedoc should be provided.

        ## Document types (typedocs):

        **client_order**: Client order - makes products reservation.

        **sale**: Sale document.

        **sale_return**: Sale return document (reverse to sale).

        **retail**: Retail sale document.

        **retail_return**: Return products of retail sale (reverse to retail).

        **payment_invoice**: Payment invoice.

        **price_list**: Price-list.

        **supplier_order**: Order to supplier (contragent) - puts products on waiting.

        **receipt**: Products income from contragent.

        **receipt_return**: Return products to contragent (reverse to receipt).

        **surplus**: Income product without contragent.

        **product_off**: Products off.

        **movement**: Move products from one stock to another.

        **manufacture**: Manufacture document.

        **disassembly**: Reverse to manufacture document.

        **inventory**: Inventory document. One inventory could have many documents.


        Document initially saved in created state, which doesn't make changes in system, basically it's just draft.
        You should call activate to make changes.

        ### Additional parameters

          You may additionally pass one of the following parameters:

          **activate** (boolean)
          If set to `true`, the document will be automatically activated after creation.

          **status_id** (string)
          If provided, the document status will be changed after creation.

          â ï¸ `activate` and `status_id` are mutually exclusive and cannot be used together.

          When `status_id` is provided, you may additionally pass:

          **target_document_pay_attributes** â payment attributes for automatically created target document
          (for example, when changing client_order to completed, a sale document will be created).

          Available fields inside `target_document_pay_attributes`:
          - typepay
          - payment_due_date
          - cashbox_id
          - bankbox_id
          - paid_by_cash
          - paid_by_bonus
          - paid_by_card
