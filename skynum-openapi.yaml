  "/v1/discounts":
    get:
      summary: List discounts
      tags:
      - Discounts
      description: |
        Fetch all discounts. Discount is a certain loyalty program which able to dynamically calculate discounts, special price or bonus for each purchase.

        ## Properties description

        **id**: Discount identifier.

        **name**: Discount name.

        **active**: Only active discounts are used in calculations. Keep in mind that start_time and end_time may also enable/disable discounts.

        **kind**: Could be one of the following - **bonus** (contragent got bonuses for each purchase), **cumulative** (discount given based on purchase levels), **special** (no discount given, contragent could get special price or even fixed price), **fixed** (simple fixed discount percentage).

        **start_time**: Discount enabled form start time. If blank, then considered as enabled from any time.

        **end_time**: Discount end time. If blank, then considered as endless discount.

        **use_fixed_price**: Applicable only for **special** discounts. If true, then **fixed_price** will be provided, otherwise **typeprice** will be provided.

        **typeprice**: Applicable only for **special** discounts. Could be any base price (price_retail, price_wholesale, etc) or custom price created by company.

        **fixed_price**: Applicable only for **special** discounts. Fixed price (float).

        **fixed_rate**: Applicable only for **fixed** discounts. Fixed discount percentage (float).

        **bonus_entry_ratio**: Applicable only for **bonus** discounts. The accrued bonuses conversion rate or how many bonuses contragent will get for one unit of money in the company accounting currency.

        **bonus_pay_ratio**: Applicable only for **bonus** discounts. The payment bonuses conversion rate or how many bonuses contragent should spend to get one unit of money in the company accounting currency.

        **bonus_max_pay**: Applicable only for **bonus** discounts. Maximum percentage of payment by bonuses in the sale document.

        **levels**: Applicable only for **cumulative** discounts. Describes which discount percentage contragent will get for certain amount of all previous purchases (array of objects).

        **only_products**: If provided, then discount applicable only for these products.

        **only_categories**: If provided, then discount applicable only for these categories. When **only_products and **only_categories* are empty, then discount applicable for all products except products that disallows discounts.

        **only_group_contragents**: If provided, then discount applicable only for these groups of contragents, othewise all contragents will get discount.

        **blocking_discounts**: If provided, then current discount won't be included into the sale document in case when blocking discount already applied.

        **discounts_aggregation**: This value is same for all discounts. Company may have many active discounts, even several discounts with the same kind. All discounts could be applied to one sale document. Discount aggregation is a mechanism  that decides how to calculate the final discount and product price. When true, then all discounts will be summed up, otherwise of all the same types of discount, the most favorable discount will be used, and from different types of discount, the discount will be used according to priority - 1) special (highest), 2) fixed, 3) cumulative. This option does not affect the bonus program; it is calculated independently.

        **created_at**: Discount create timestamp.

        **updated_at**: Discount update timestamp.
      security:
      - bearer: []
      parameters:
      - name: x-partner-token
        in: header
      responses:
