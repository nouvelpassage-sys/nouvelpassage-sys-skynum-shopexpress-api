  "/v1/products":
    get:
      summary: List products
      tags:
      - Products
      description: Fetch products. You shouldn't call this endpoint too often, ideally
        products should be synchronized periodically starting from 1 hour.
      security:
      - bearer: []
      parameters:
      - name: x-partner-token
        in: header
      - name: offset
        in: query
        description: Page offset. Default 1.
        schema:
          type: string
      - name: limit
        in: query
        description: Records limit. Default 100 records, maximum is 1000. Please,
          use offset if you need more records.
        schema:
          type: string
      - name: query
        in: query
        description: Filter by title, code or SKU
        schema:
          type: string
      - name: producer_id
        in: query
        description: Filter by producer
        schema:
          type: string
      - name: product_type
        in: query
        stype: string
        description: Filter by product type - goods, kit, service, product
      - name: category_id
        in: query
        description: Filter by category
        schema:
          type: string
      - name: archive
        in: query
        description: Show only archive products
        schema:
          type: boolean
      - name: updated_from
        in: query
        description: Filter by updated time (from). Product won't be updated on changing
          stock remains quantity or reserve.
        schema:
          type: string
      - name: updated_to
        in: query
        description: Filter by updated time (to). Product won't be updated on changing
          stock remains quantity or reserve.
        schema:
          type: string
      - name: extended
        in: query
        description: Extends response with remains, reserve and waiting fields
        schema:
          type: boolean
      - name: with_images
        in: query
        description: Include product and modification images
        schema:
          type: boolean
      - name: with_custom_fields
        in: query
        description: Include product custom fields
        schema:
          type: boolean
      - name: stock_id
        in: query
        description: 'Stock for remains, reserve and waiting. Works only with exteded
          param. May accept one or multiple stock ids. Default: all stocks.'
        schema:
          type: string
