info:
  title: API V1
  version: v1
  description: |
    ## Welcome to Skynum API!

    **API is enabled upon request** and available only for `Company` subscription. But, if you need to try it out during trial period feel free to ask our support team.

    We are open to other friendly platforms and services that works in B2B segment.
    If you want to develop an integration with Skynum,
    please contact us and **we will provide you with special partner token to bypass the subscription restrictions**.
    We also invite you to join our [partners program](https://partners.skynum.com/sign_in).

    Before you start, please **create a non-admin user** and assign a **role with API access**.
    Admin users are not allowed to make API requests due to security considerations.

    ### Authentication

    Skynum API uses **Personal API Tokens**.

    - Generate an API token in the platform UI: **Settings â Users â open a user â API token**.
    - The token is shown **only once** immediately after generation. Store it securely.
    - You can reset the token at any time â the previous token becomes invalid immediately.

    Send the token with every request:

    `Authorization: Bearer <YOUR_API_TOKEN>`

    All requests must include the `Content-Type: application/json` header and use UTF-8 encoding.

    ---

    ### Rate limits & usage policy

    To ensure stable performance and fair resource usage, Skynum API applies request and execution limits.

    ---

    #### 1. Request rate limits

    The API may return **429 Too Many Requests** if too many requests are sent in a short period of time.

    If you receive 429:
    - Reduce request frequency
    - Retry later
    - Avoid burst traffic and aggressive polling

    The API is designed for business system integrations, not high-frequency polling.

    ---

    #### 2. Time-based execution limit (per company)

    Each company has a maximum total API processing time of **10 minutes per sliding 1-hour window** (unless a custom limit is configured).

    Important details:

    - The limit is measured as total request execution time.
    - The 1-hour window is sliding (it does not reset at a fixed clock time).
    - When the limit is exceeded, new requests are rejected immediately.

    Response when exceeded:
    - **429 Too Many Requests**
    - The error message includes the number of seconds to wait before retrying.

    ---

    #### 3. Write request concurrency

    Only one write request may be processed at a time per company.

    Write requests include:
    - POST
    - PUT
    - PATCH
    - DELETE

    If another write request is already in progress, the API will respond with:

    - **429 Too Many Requests**
    - error: ***Concurrent write locked***

    Integrations must queue write operations and avoid parallel write requests.
